spring.application.name=spring-ai
server.port=8081
spring.config.import=optional:file:../.env[.properties]

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

#GROQ (OpenAI Compatible)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

# spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers-filesystem-docker.json
spring.ai.mcp.client.enabled=false