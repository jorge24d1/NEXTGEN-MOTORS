# =============================================
# PERFIL PRODUCCIÓN — Render.com
# =============================================

# MCP vía HTTP/SSE (sin Docker, sin stdio)
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.stdio.enabled=false
spring.ai.mcp.client.sse.connections.filesystem.url=${MCP_FILESYSTEM_URL}
spring.ai.mcp.client.sse.connections.dbhub.url=${MCP_DBHUB_URL}
spring.ai.mcp.client.initialization-timeout=120s

# Cookies seguras con HTTPS
server.servlet.session.cookie.secure=true

# Desactivar devtools
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true

# Logging reducido
logging.level.com.concesionario=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.ai=INFO

# URL base de producción (Render asigna esta URL)
app.base-url=${APP_BASE_URL}

# Pool de conexiones más conservador en Render Free
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
