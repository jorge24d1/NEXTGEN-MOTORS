# =============================================
# PERFIL PRODUCCIÓN — Render.com
# =============================================

# ── MCP: anular stdio del application.properties base ──
# Apuntar a JSON vacío para que NO intente lanzar Docker
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers-empty.json
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialization-timeout=120s

# ── MCP: conexiones SSE a los servidores en Render ──
spring.ai.mcp.client.sse.connections.filesystem.url=${MCP_FILESYSTEM_URL}
spring.ai.mcp.client.sse.connections.dbhub.url=${MCP_DBHUB_URL}

# ── Cookies seguras con HTTPS ──
server.servlet.session.cookie.secure=true

# ── Desactivar devtools ──
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true

# ── Logging reducido ──
logging.level.com.concesionario=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.ai=INFO

# ── URL base de producción ──
app.base-url=${APP_BASE_URL}

# ── Pool de conexiones conservador para Render Free (512MB) ──
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

